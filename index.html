<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
</head><body>
	<div id="root"></div>
	<script type="module">
		const basePath = import.meta.env.BASE_URL || '/';
		const { pathname, search, hash } = window.location;

		const normalize = (route) => route.replace(/^\/+/, '').replace(/\/+$/, '') || '/';

		if (!hash) {
			const base = basePath === '/' ? '/' : basePath.replace(/\/+$/, '') + '/';
			const route = pathname === base ? '/' : pathname.replace(new RegExp(`^${base.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}`), '') || '/';
			const safeRoute = normalize(route);
			const targetHash = safeRoute === '/' ? '/' : `/${safeRoute}`;
			const targetPath = `${base}#${targetHash}${search}`;

			if (pathname !== '/' || !hash) {
				window.location.replace(targetPath);
			}
		}
	</script>
	<script type="module" src="/src/main.jsx"></script>
</body></html>
